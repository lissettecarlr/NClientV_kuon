name: Release

# Pushing main builds the signed release APK and publishes it as a GitHub release.
# The app (VersionChecker) looks at the latest release of this repo, and installs the .apk asset when the
# tag is newer than its own version. So: bump patchVersion in app/build.gradle.kts before pushing main.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore, as base64 (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks")))
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# The same key must be used for every release, or phones can not update (INSTALL_FAILED_UPDATE_INCOMPATIBLE).

on:
    push:
        branches:
            - 'main'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0 # the release notes list the commits since the previous release

            -   name: Read version from build.gradle.kts
                id: version
                run: |
                    get() { grep -E "^val $1 =" app/build.gradle.kts | grep -oE '[0-9]+' | head -n 1; }
                    version="$(get majorVersion).$(get minorVersion).$(get patchVersion)"
                    echo "version=$version" >> "$GITHUB_OUTPUT"
                    echo "Version: $version"

            -   name: Is this version already released?
                id: exists
                run: |
                    if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
                        echo "exists=true" >> "$GITHUB_OUTPUT"
                        echo "::warning::Release v${{ steps.version.outputs.version }} already exists, nothing published. Bump patchVersion in app/build.gradle.kts."
                    else
                        echo "exists=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: set up JDK 17
                if: steps.exists.outputs.exists == 'false'
                uses: actions/setup-java@v6.1.0
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Restore the signing key
                if: steps.exists.outputs.exists == 'false'
                env:
                    KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    if [ -z "$KEYSTORE_BASE64" ]; then
                        echo "::error::Secret KEYSTORE_BASE64 is missing (see the comment at the top of release.yml)"
                        exit 1
                    fi
                    echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
                    {
                        echo "storeFile=$RUNNER_TEMP/release.jks"
                        echo "storePassword=$KEYSTORE_PASSWORD"
                        echo "keyAlias=$KEY_ALIAS"
                        echo "keyPassword=$KEY_PASSWORD"
                    } > keystore.properties

            -   name: Build the release APK
                if: steps.exists.outputs.exists == 'false'
                run: |
                    chmod +x gradlew
                    ./gradlew assemblePost28Release

            -   name: Publish the release
                if: steps.exists.outputs.exists == 'false'
                run: |
                    version="${{ steps.version.outputs.version }}"
                    apk="$(find app/build/outputs/apk/post28/release -name 'NClientV_kuon_*.apk' | head -n 1)"
                    test -f "$apk" || { echo "::error::APK not found"; exit 1; }
                    # commits since the previous release (merge commits left out), at most 30
                    previous="$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)"
                    if [ -n "$previous" ]; then range="$previous..HEAD"; else range="HEAD"; fi
                    {
                        echo "NClientV_kuon $version"
                        git log "$range" --no-merges -n 30 --pretty='- %s'
                    } > "$RUNNER_TEMP/notes.md"
                    gh release create "v$version" "$apk" \
                        --target "${{ github.sha }}" \
                        --title "NClientV_kuon $version" \
                        --notes-file "$RUNNER_TEMP/notes.md"
